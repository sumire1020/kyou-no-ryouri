<!doctype html><html lang="ja"><head>  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">  <title>今日の料理</title><meta name="description" content="在庫の材料から、今日の一皿を考えるローカル料理アシスタント">  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231a2f38'/%3E%3Cpath d='M17 25h30v21H17z' fill='%23f2b15a'/%3E%3Cpath d='M22 20c4-9 16-9 20 0' fill='none' stroke='%23f7ede0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">  <style>    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');    .intro h1 span{display:block}.empty p::after{content:"食品名を入力して、右の「＋」を押すと材料を追加できます。";display:block;margin-top:12px;color:#a3612b;font-weight:700}    :root{--ink:#1a2f38;--cream:#fffaf3;--paper:#fffdf9;--orange:#f2a44b;--orange-dark:#d87324;--mint:#d8eee4;--line:#e9dfd2;--muted:#68767a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Zen Maru Gothic','DM Sans',sans-serif;font-size:16px;line-height:1.65}.wrap{max-width:1120px;margin:auto;padding:32px 24px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{display:flex;gap:11px;align-items:center;font:700 23px 'DM Sans','Zen Maru Gothic',sans-serif;letter-spacing:.02em}.pot{display:grid;place-items:center;width:38px;height:38px;background:var(--ink);border-radius:13px;color:#f8c778;font-size:20px}.privacy{font-size:13px;color:var(--muted);background:#fff;padding:7px 12px;border-radius:999px;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 1.1fr;gap:28px;align-items:start}.intro{padding:20px 6px}.eyebrow{font:600 13px 'DM Sans',sans-serif;letter-spacing:.12em;color:var(--orange-dark);text-transform:uppercase}.intro h1{font-size:clamp(34px,5vw,58px);line-height:1.22;letter-spacing:-.05em;margin:12px 0 16px}.intro p{color:var(--muted);max-width:28em;margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 15px 45px rgba(93,61,31,.07)}label{display:block;font-weight:700;margin:0 0 9px}.ingredient-row{display:flex;gap:8px}.ingredient-row input{flex:1}.field input,.field textarea,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;color:var(--ink);font:inherit;outline:none}.field input:focus,.field textarea:focus,input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,164,75,.16)}textarea{min-height:74px;resize:vertical}.add{border:0;background:var(--mint);color:var(--ink);font:700 20px inherit;border-radius:13px;width:49px;cursor:pointer}.chips{min-height:46px;display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}.chip{display:flex;align-items:center;gap:8px;background:#fff3df;border-radius:999px;padding:6px 10px 6px 13px;font-size:14px}.chip button{border:0;b  </style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="pot">⌁</span>今日の料理</div><div class="privacy">ローカルで使う、あなただけの献立帳</div></header><div class="grid"><section class="intro"><div class="eyebrow">Pantry to plate</div><h1><span>あるもので、</span><span>ちゃんとおいしい。</span></h1><p>冷蔵庫にある材料を入れるだけ。今日の気分に合う、作りやすい一皿を考えます。</p></section><section class="card" aria-label="材料を入力"><form id="menuForm"><label for="ingredient">在庫の材料</label><div class="ingredient-row"><input id="ingredient" placeholder="例：鶏もも肉" autocomplete="off"><button class="add" id="add" type="button" aria-label="材料を追加">＋</button></div><div class="chips" id="chips" aria-live="polite"></div><div class="quick">すぐ追加：<button type="button" data-item="卵">卵</button>・<button type="button" data-item="玉ねぎ">玉ねぎ</button>・<button type="button" data-item="ごはん">ごはん</button>・<button type="button" data-item="豆腐">豆腐</button></div><div class="row"><div class="field"><label for="servings">人数</label><input id="servings" type="number" min="1" max="12" value="2"></div><div class="field"><label for="note">気分・条件 <span style="font-weight:400;color:#68767a">（任意）</span></label><input id="note" placeholder="例：15分以内、辛くしない"></div></div><button class="submit" id="submit" type="submit">✦ 今日の一皿を考える</button><div class="error" id="error" role="alert"></div></form></section><section class="result"><div class="empty" id="empty"><div><div class="empty-icon">🥕</div><strong>材料を入れてみましょう</strong><p>作り方、コツ、気をつけることまで、短く見やすくまとめます。</p></div></div><article class="recipe card" id="recipe" aria-live="polite"><div class="recipe-head"><div class="eyebrow">Suggested menu</div><h2 id="title"></h2><p id="summary"></p><div class="meta" id="meta"></div></div><div class="section"><h3>材料</h3><ul id="recipeIngredients"></ul></div><div class="section"><h3>作り方</h3><ol id="steps"></ol></div><div class="section note"><h3>おいしく作るポイント</h3><ul id="tips"></ul></div><div class="section note warn"><h3>注意点</h3><ul id="cautions"></ul></div></article></section></div><p class="footer">使い方：環境変数 <code>OPENAI_API_KEY</code> を設定後、<code>npm start</code> で起動します。APIキーは画面やファイルには保存されません。</p></main><script>const items=[];const $=id=>document.getElementById(id);const chips=$('chips');function render(){chips.innerHTML=items.map((v,i)=>`<span class="chip">${escapeHtml(v)}<button type="button" aria-label="${escapeHtml(v)}を削除" onclick="removeItem(${i})">×</button></span>`).join('')}function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function addItem(v=$('ingredient').value){v=v.trim().replace(/[、,]/g,'');if(v&&!items.includes(v))items.push(v);$('ingredient').value='';render()}function removeItem(i){items.splice(i,1);render()}$('add').onclick=()=>addItem();$('ingredient').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem()}});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>addItem(b.dataset.item));function displayValue(v){if(typeof v==='string'||typeof v==='number')return String(v);if(v&&typeof v==='object'){const first=v.name||v.ingredient||v.item||v.label||'';const second=v.amount||v.quantity||v.measurement||v.unit||'';return [first,second].filter(Boolean).join(' ')||Object.values(v).filter(x=>typeof x==='string'||typeof x==='number').join(' ')}return ''}function fill(id,values){$(id).innerHTML=(values||[]).map(v=>`<li>${escapeHtml(displayValue(v))}</li>`).join('')}$('menuForm').onsubmit=async e=>{e.preventDefault();if($('ingredient').value.trim())addItem();const error=$('error');error.classList.remove('show');if(!items.length){error.textContent='材料を1つ以上追加してください。';error.classList.add('show');return}const btn=$('submit');btn.disabled=true;btn.textContent='献立を考えています…';try{const r=await fetch('/api/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ingredients:items,servings:Number($('servings').value)||2,note:$('note').value.trim()})});const data=await r.json();if(!r.ok)throw Error(data.error);$('title').textContent=data.title;$('summary').textContent=data.summary;$('meta').innerHTML=[data.time,...(data.tags||[])].filter(Boolean).map(x=>`<span class="badge">${escapeHtml(x)}</span>`).join('');fill('recipeIngredients',data.ingredients);fill('steps',data.steps);fill('tips',data.tips);fill('cautions',data.cautions);$('empty').style.display='none';$('recipe').classList.add('show');$('recipe').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(err){error.textContent=err.message||'レシピを作成できませんでした。';error.classList.add('show')}finally{btn.disabled=false;btn.textContent='✦ 今日の一皿を考える'}};</script></body></html>
